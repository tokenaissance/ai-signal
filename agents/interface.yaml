interface:
  display_name: "AI Signal"
  short_description: "为 Agent 用户追踪 AI 一线信号（X / 播客 / 官方博客 / arXiv 论文），Agent 读取中央 JSON feed 按用户偏好生成个性化日报，可推送到 Telegram / 飞书 / 邮件或聊天窗口"
  default_prompt: "Use $ai-signal as the Agent-side AI daily digest curator. First confirm the user wants AI/investing signal tracking or a digest (or invoked /ai-signal). Locate a complete AI Signal checkout (scripts/prepare_digest.py plus references/ next to SKILL.md); if only SKILL.md is present, install the runtime checkout into ~/.ai-signal/runtime automatically. Read the central JSON feeds (feeds/feed-x.json, feed-podcasts.json, feed-blogs.json, feed-arxiv.json) which are fetched centrally daily — no content API keys needed. Generate the personalized digest by following the user's stored preferences in ~/.ai-signal/ and the prompt templates in ~/.ai-signal/prompts/ (or this repo's prompts/). Default is JSON-first: do not depend on central Chinese summaries unless the user's config sets include_central_summaries: true. Deliver into the current chat or via Telegram / Feishu / email when the user asks. On explicit requests, expand a podcast by guid (transcripts are cached 14 days); record user feedback locally in ~/.ai-signal/feedback.jsonl and use the last 90 days as soft ranking preference; never upload feedback to the central service. Respect delivery, language, and verbosity preferences from config, and offer manual /ai-signal invocation for non-persistent agents."
  examples:
    - "帮我安装 https://github.com/tokenaissance/ai-signal"
    - "生成今天的 AI 日报"
    - "展开第 2 个播客"
    - "把今天的信号推送到 Telegram"
    - "只看 AI 的，不要投资"
    - "切回英文，详细一点"
    - "P2 有用，X1 是噪音"
    - "展开 Vercel agents 这期，按核心观点、论证链、关键引用展开"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "fastagent"
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
    - "vscode"
  activation:
    mode: "manual"
    paths: ["/ai-signal"]
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "remote"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow feed and source metadata; forbid unreviewed execution"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "fetch central JSON feeds from GitHub and jsDelivr CDN mirrors only; delivery to Telegram / Feishu / email only when the user supplies delivery credentials and asks for it"
    file_write: "user configuration under ~/.ai-signal/ and its prompts/, feedback.jsonl; never replace user config while refreshing the runtime checkout"
    subprocess: "python3 for the bundled scripts (prepare_digest.py, deliver.py, feedback.py, render_digest.py) and transcription backends; no arbitrary code execution"
    interactive: "avoid unless delivery platform auth requires it"
  degradation:
    fastagent: "canonical-source"
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    agent-skills-compatible: "canonical-source"
    vscode: "neutral-source-plus-review-notes"
gates:
  scaffold:
    - "SKILL.md frontmatter with name and description"
    - "README hook and natural trigger examples"
    - "clear exclusions (one-off summaries are not digests)"
  production:
    - "agents/interface.yaml"
    - "evals/trigger_cases.json"
    - "manifest.json with semver version"
    - "install and README verification (npx skills add and git clone paths)"
    - "root-only discoverable SKILL.md entrypoint"
    - "no content API keys required from users"
  library:
    - "reports/skill-ir.json"
    - "reports/trigger-eval.json"
    - "portability notes across Agent platforms"
    - "trust boundary (central service fetches; user agent digests; feedback stays local)"
  governed:
    - "secret scan (no delivery credentials committed)"
    - "rollback boundary (runtime checkout refresh never replaces ~/.ai-signal/ config)"
    - "public claim guard (feed freshness and coverage claims match tests)"
    - "README, MIT LICENSE, and install evidence verified"
