name: Sync from upstream

# Keeps tokenaissance/ai-signal (our install & feed source) current with the
# upstream Benboerba620/ai-signal runtime. Runs every 12h ("半天级"), offset
# from the feed-generation runs (22:00 / 01:30 UTC).
#
# Policy on conflict: our fork side wins. `feeds/` is generated by OUR
# daily-digest workflow, and the package files (agents/ evals/ reports/
# manifest.json SKILL.md README.md LICENSE docs/) plus the three patched
# runtime scripts are fork-owned. Upstream changes only merge cleanly into the
# shared runtime (scripts/ config/ prompts/ tests/ requirements*).
#
# After the merge we re-assert the tokenaissance feed-endpoint invariant in
# scripts/prepare_digest.py — if it ever drops, the run fails loudly.

on:
  schedule:
    - cron: '17 4,16 * * *'  # 04:17 / 16:17 UTC = 12:17 / 00:17 Beijing
  workflow_dispatch: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Benboerba620/ai-signal.git
          git fetch upstream main

      - name: Merge upstream main (fork side wins on conflict)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          git merge upstream/main --no-edit > /tmp/sync-merge.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "merge clean or nothing to merge"
          elif git diff --name-only --diff-filter=U | grep -q .; then
            echo "conflicts detected; keeping fork side:"
            git diff --name-only --diff-filter=U | sed 's/^/  /'
            for f in $(git diff --name-only --diff-filter=U); do
              git checkout --ours -- "$f"
              git add -- "$f"
            done
            git commit -m "sync: merge upstream/main, keep fork files on conflict"
          else
            cat /tmp/sync-merge.log
            echo "::error::merge failed for a non-conflict reason"
            exit 1
          fi

      - name: Re-assert tokenaissance feed endpoints
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("scripts/prepare_digest.py")
          src = p.read_text(encoding="utf-8")

          src = src.replace(
              "https://raw.githubusercontent.com/Benboerba620/ai-signal/main",
              "https://raw.githubusercontent.com/tokenaissance/ai-signal/main",
          )
          src = re.sub(
              r"https://[a-z0-9.]+\.jsdelivr\.net/gh/Benboerba620/ai-signal@main",
              lambda m: m.group(0).replace("Benboerba620", "tokenaissance"),
              src,
          )
          p.write_text(src, encoding="utf-8")

          # Invariant: every feed endpoint must point at our repo, and no
          # upstream-endpoint may remain. Fail loudly if the structure changed.
          assert "Benboerba620/ai-signal" not in src, \
              "upstream feed endpoints survived the sync fixup"
          assert src.count("tokenaissance/ai-signal@main") >= 4, \
              "jsDelivr mirrors not re-pointed to tokenaissance"
          PY
          if git diff --quiet scripts/prepare_digest.py; then
            echo "prepare_digest.py unchanged (already tokenaissance)"
          else
            git add scripts/prepare_digest.py
            git commit -m "sync: re-assert tokenaissance feed endpoints"
          fi

      - name: Push
        run: git push origin main
